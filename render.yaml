# Render deploy for the Circa Survivor HTML app (FastAPI).
# One-time setup on render.com:
#   1. New + -> Blueprint -> connect the Jacob-dashboard/circa-survivor repo.
#   2. Render reads this file. Set the env vars marked sync:false in the
#      dashboard (they are secrets, not committed):
#        APP_PASSWORD   -> the login password you want
#        GITHUB_TOKEN   -> a GitHub PAT with contents:write on this repo
#   3. Auto-Deploy is ON so code pushes go live automatically. Cloud state
#      writes are made with "[skip render]" in the commit message (see
#      git_sync.push_state), so they persist via git WITHOUT triggering a
#      redeploy — you get push-to-deploy for code and no churn from picks.
#      NOTE: flipping this value only takes effect when the blueprint is
#      re-synced (or toggle Auto-Deploy in the dashboard once).
services:
  - type: web
    name: circa-survivor
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn survivor.webapp:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: APP_USER
        value: circa
      - key: APP_PASSWORD
        sync: false          # set in dashboard — the login password
      - key: GIT_BACKED_STATE
        value: "1"
      - key: GIT_REMOTE
        value: Jacob-dashboard/circa-survivor
      - key: GITHUB_TOKEN
        sync: false          # set in dashboard — GitHub PAT, contents:write
      - key: PYTHON_VERSION
        value: "3.12.7"
